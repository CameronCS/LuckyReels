<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Lucky Reels</h1>
    <p class="subtitle">Create your account</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Username</label>
        <input formControlName="name" placeholder="Choose a username" autocomplete="username" />
      </div>
      <div class="field">
        <label>Email</label>
        <input formControlName="email" type="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input formControlName="password" type="password" placeholder="Min. 6 characters" autocomplete="new-password" />
      </div>
      <p class="error-msg" *ngIf="error">{{ error }}</p>
      <button class="btn-primary" type="submit" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <p class="footer-link">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
