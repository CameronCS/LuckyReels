<div class="stars" #starsEl></div>

<div class="lobby">
  <div class="lobby-card">
    <div class="lobby-logo">Lucky Reels</div>
    <p class="lobby-tagline">Casino · Est. Tonight</p>

    <div class="lobby-tabs">
      <button class="lobby-tab" [class.active]="mode === 'register'" (click)="switchTab('register')">Register</button>
      <button class="lobby-tab" [class.active]="mode === 'login'" (click)="switchTab('login')">Login</button>
    </div>

    <!-- Login form -->
    <ng-container *ngIf="mode === 'login'">
      <form [formGroup]="loginForm" (ngSubmit)="submit()">
        <input class="lobby-input" formControlName="username" placeholder="Username..." maxlength="20" autocomplete="off">
        <input class="lobby-input" formControlName="password" placeholder="Password..." maxlength="72" type="password" style="margin-bottom:4px">
        <div class="lobby-error">{{ error }}</div>
        <button class="lobby-btn" type="submit" [disabled]="loading">{{ loading ? 'SIGNING IN...' : 'LOGIN' }}</button>
      </form>
    </ng-container>

    <!-- Register form -->
    <ng-container *ngIf="mode === 'register'">
      <form [formGroup]="registerForm" (ngSubmit)="submit()">
        <input class="lobby-input" formControlName="name" placeholder="Username..." maxlength="20" autocomplete="off">
        <input class="lobby-input" formControlName="email" placeholder="Email..." maxlength="100" type="email" autocomplete="email">
        <input class="lobby-input" formControlName="password" placeholder="Password..." maxlength="72" type="password" style="margin-bottom:4px">
        <div class="lobby-error">{{ error }}</div>
        <button class="lobby-btn" type="submit" [disabled]="loading">{{ loading ? 'CREATING...' : 'CREATE ACCOUNT' }}</button>
      </form>
    </ng-container>
  </div>
</div>
