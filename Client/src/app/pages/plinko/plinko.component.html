<div class="stars" #starsEl></div>

<div class="app-wrapper">

  <div class="game-header">
    <button class="back-btn" (click)="goBack()">← Hub</button>
    <div class="header-center">
      <h1>Plinko</h1>
      <p class="tagline">8 Rows · 9 Slots · Drop & Pray</p>
    </div>
    <div class="header-right">
      <div class="player-pill">🎯 {{ userName }}</div>
      <div class="tokens-box">
        <div class="tokens-box-label">🪙 Tokens</div>
        <div class="tokens-value" [class.bump]="tokensBump">{{ tokens }}</div>
      </div>
    </div>
  </div>

  <div class="board-wrapper">
    <canvas #plinkoCanvas></canvas>
    <div [ngClass]="resultCls">{{ resultText }}</div>
  </div>

  <div class="risk-bar">
    <span class="risk-label">RISK</span>
    <button class="risk-btn" *ngFor="let r of riskOptions"
            [class.active]="risk === r"
            (click)="setRisk(r)">{{ r.toUpperCase() }}</button>
  </div>

  <div class="controls-bar">
    <span class="bet-label">Bet</span>
    <button class="bet-btn" *ngFor="let b of presetBets"
            [class.active]="activeBet === b"
            (click)="setBet(b)">{{ b }}</button>
    <input class="bet-custom" type="number" [(ngModel)]="customBet"
           (input)="onCustomBet()" placeholder="custom" min="10">
    <div class="current-bet-display">BET <span>{{ bet }}</span></div>
  </div>

  <div class="action-bar">
    <button class="btn-drop" (click)="drop()"
            [disabled]="!canDrop"
            [textContent]="canDrop ? 'DROP · ' + bet : 'Need ' + bet + ' tokens'"></button>
  </div>

  <div class="no-tokens-msg" *ngIf="tokens <= 0">⛔ Out of tokens — ask the admin to top you up.</div>

  <div class="rules-strip">
    <div class="rule"><span class="c-pink">High risk</span>29× edge, 0.2× center</div>
    <div class="rule"><span class="c-amber">Medium</span>13× edge, 0.4× center</div>
    <div class="rule"><span class="c-blue">Low risk</span>5.6× edge, 0.5× center</div>
    <div class="rule"><span class="c-dim">House edge</span>~1% on all payouts</div>
  </div>

</div>
